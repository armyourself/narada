name: Build Only (Node + Client)

on:
  workflow_dispatch:

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}

jobs:
  build-node:
    name: Build Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
            simple_os: linux
            icon: node/assets/icons/icon.ico
          - os: windows-latest
            ext: ".exe"
            simple_os: windows
            icon: node/assets/icons/icon.ico
          - os: macos-13
            ext: ""
            simple_os: macos-x64
            icon: node/assets/icons/icon.icns
          - os: macos-latest
            ext: ""
            simple_os: macos-arm64
            icon: node/assets/icons/icon.icns

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: node/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build node executable
        working-directory: node
        shell: bash
        run: |
            uv sync
            uv pip install pyinstaller
            uv run pyinstaller \
                --onefile \
                --name lattice-node \
                --icon=${{ matrix.icon }} \
                --paths=. \
                src/main.py

      - name: Rename executable to include version and OS
        run: |
          mkdir -p dist
          mv node/dist/lattice-node${{ matrix.ext }} dist/Lattice-Node_${{ env.VERSION }}_${{ matrix.simple_os }}${{ matrix.ext }}

  build-client:
    name: Build Client (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
        contents: write
    strategy:
        fail-fast: false
        matrix:
          include:
            - platform: 'macos-latest' # for Arm based macs (M1 and above).
              args: '--target aarch64-apple-darwin'
            - platform: 'macos-latest' # for Intel based macs.
              args: '--target x86_64-apple-darwin'
            - platform: 'ubuntu-24.04'
              args: ''
            - platform: 'windows-latest'
              args: ''

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/.bun-version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-0=2.44.0-2 \
              libwebkit2gtk-4.1-dev=2.44.0-2 \
              libjavascriptcoregtk-4.1-0=2.44.0-2 \
              libjavascriptcoregtk-4.1-dev=2.44.0-2 \
              gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
              gir1.2-webkit2-4.1=2.44.0-2 \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf

      - name: Install frontend dependencies
        working-directory: client
        run: bun install

      - name: Build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Rename client executable (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
            mkdir -p dist
            if [[ "${{ matrix.args }}" == *"aarch64-apple-darwin"* ]]; then
                ARCH_NAME="macos-arm64"
            elif [[ "${{ matrix.args }}" == *"x86_64-apple-darwin"* ]]; then
                ARCH_NAME="macos-x64"
            else
                ARCH_NAME="macos"
            fi
            echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV

            mv client/src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg \
            dist/Lattice_${{ env.VERSION }}_${ARCH_NAME}.dmg

      - name: Rename client executable (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
            mkdir -p dist
            echo "ARCH_NAME=linux" >> $GITHUB_ENV
            mv client/src-tauri/target/release/bundle/appimage/*.AppImage \
            dist/Lattice_${{ env.VERSION }}_linux.AppImage
            mv client/src-tauri/target/release/bundle/deb/*.deb \
            dist/Lattice_${{ env.VERSION }}_linux.deb
            mv client/src-tauri/target/release/bundle/rpm/*.rpm \
            dist/Lattice_${{ env.VERSION }}_linux.rpm

      - name: Rename client executable (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            echo "ARCH_NAME=windows" >> $env:GITHUB_ENV
            Move-Item "client/src-tauri/target/release/bundle/nsis/*.exe" `
            "dist/Lattice_${{ env.VERSION }}_windows.exe"
