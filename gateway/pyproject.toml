[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Narada-gateway"
version = "0.0.1-alpha0"
description = "Narada gateway: bridge between the Narada protocol and conventional email (SMTP/IMAP)."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Narada contributors" },
]
dependencies = [
    "Narada-node",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
