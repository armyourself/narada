[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Narada-gateway"
version = "0.0.1-alpha0"
description = "Narada gateway: bridge between the Narada protocol and conventional email (SMTP/IMAP)."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Narada contributors" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "Narada-node",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*"]
