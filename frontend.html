<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Mail</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            sidebar: '#f7f7f5',
                            sidebarDark: '#191919',
                            hover: '#efefed',
                            hoverDark: '#262626',
                            active: '#e8e8e6',
                            activeDark: '#2f2f2f',
                            border: '#e6e6e3',
                            borderDark: '#2a2a2a',
                            text: '#37352f',
                            textMuted: '#84827e',
                            badgeBlueBg: '#e0f2fe',
                            badgeBlueText: '#0369a1',
                            badgeRedBg: '#ffe4e6',
                            badgeRedText: '#be123c',
                            badgePinkBg: '#fce7f3',
                            badgePinkText: '#be185d',
                            badgePurpleBg: '#f3e8ff',
                            badgePurpleText: '#7e22ce',
                            badgeGreenBg: '#dcfce7',
                            badgeGreenText: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars matching Notion */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }
        .command-modal-shadow {
            box-shadow: rgba(15, 15, 15, 0.05) 0px 0px 0px 1px, rgba(15, 15, 15, 0.1) 0px 5px 10px, rgba(15, 15, 15, 0.2) 0px 15px 40px;
        }
    </style>
</head>
<body class="h-full bg-white dark:bg-[#121212] text-notion-text dark:text-gray-200 font-sans antialiased overflow-hidden select-none">

    <div class="flex h-full w-full">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 flex-shrink-0 bg-notion-sidebar dark:bg-notion-sidebarDark border-r border-notion-border dark:border-notion-borderDark flex flex-col justify-between h-full transition-all duration-200 z-20">
            <div>
                <!-- Top Header / macOS Window Controls & User Switching -->
                <div class="p-3 pb-1">
                    <!-- Window Controls (Red, Yellow, Green dots) -->
                    <div class="flex items-center space-x-2 mb-3 pl-1 pt-0.5">
                        <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block border border-black/10"></span>
                        <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block border border-black/10"></span>
                        <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block border border-black/10"></span>
                    </div>

                    <!-- Profile Switcher & Compose Button -->
                    <div class="flex items-center justify-between group">
                        <button onclick="toggleProfileMenu()" class="flex items-center space-x-2 hover:bg-notion-hover dark:hover:bg-notion-hoverDark p-1.5 rounded-md transition-colors text-left flex-1 min-w-0 mr-1">
                            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=120" alt="Stephanie Lee" class="w-6 h-6 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-gray-700">
                            <span class="font-medium text-sm text-gray-800 dark:text-gray-200 truncate">Stephanie Lee</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-notion-textMuted flex-shrink-0"></i>
                        </button>
                        
                        <button onclick="openComposeModal()" title="Compose new message (N)" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md transition-colors">
                            <i data-lucide="square-pen" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- Profile Dropdown Menu -->
                    <div id="profileMenu" class="hidden absolute left-4 top-16 w-56 bg-white dark:bg-[#202020] rounded-lg shadow-lg border border-notion-border dark:border-notion-borderDark p-1.5 z-50 text-xs text-gray-700 dark:text-gray-200">
                        <div class="px-2 py-1.5 font-medium text-notion-textMuted border-b border-notion-border dark:border-notion-borderDark mb-1">
                            stephanie.lee@lumi.inc
                        </div>
                        <button onclick="toggleProfileMenu()" class="w-full text-left px-2 py-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded flex items-center space-x-2">
                            <i data-lucide="user" class="w-3.5 h-3.5"></i>
                            <span>Account settings</span>
                        </button>
                        <button onclick="toggleDarkMode()" class="w-full text-left px-2 py-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded flex items-center space-x-2">
                            <i data-lucide="moon" class="w-3.5 h-3.5"></i>
                            <span>Toggle Dark Theme</span>
                        </button>
                        <div class="border-t border-notion-border dark:border-notion-borderDark my-1"></div>
                        <button onclick="toggleProfileMenu()" class="w-full text-left px-2 py-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded text-red-600 dark:text-red-400 flex items-center space-x-2">
                            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                            <span>Log out</span>
                        </button>
                    </div>
                </div>

                <!-- Search Button (Triggers Command Palette Modal) -->
                <div class="px-2 py-1">
                    <button onclick="openCommandPalette()" class="w-full flex items-center justify-between px-2.5 py-1.5 text-sm text-notion-textMuted hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md transition-colors group">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="search" class="w-4 h-4 text-notion-textMuted"></i>
                            <span class="text-sm font-normal text-gray-600 dark:text-gray-400">Search</span>
                        </div>
                        <span class="text-[11px] font-medium bg-gray-200/60 dark:bg-gray-800 text-gray-500 px-1.5 py-0.5 rounded border border-gray-300/40 dark:border-gray-700">⌘K</span>
                    </button>
                </div>

                <!-- Views Navigation Section -->
                <div class="px-2 pt-3 pb-1">
                    <div class="px-2 py-1 text-[11px] font-semibold text-notion-textMuted uppercase tracking-wider">Views</div>
                    <nav class="space-y-0.5 mt-0.5" id="viewsNav">
                        <!-- Inbox -->
                        <button onclick="switchView('inbox')" id="view-inbox" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm font-medium transition-colors bg-notion-active dark:bg-notion-activeDark text-gray-900 dark:text-white">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="inbox" class="w-4 h-4 text-red-500"></i>
                                <span class="truncate">Inbox</span>
                            </div>
                            <span class="text-xs text-notion-textMuted font-normal" id="badge-inbox">8</span>
                        </button>

                        <!-- Project updates -->
                        <button onclick="switchView('project-updates')" id="view-project-updates" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="target" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Project updates</span>
                            </div>
                            <span class="text-xs text-notion-textMuted font-normal">1</span>
                        </button>

                        <!-- Leadership updates -->
                        <button onclick="switchView('leadership-updates')" id="view-leadership-updates" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="accessibility" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Leadership updates</span>
                            </div>
                            <span class="text-xs text-notion-textMuted font-normal">1</span>
                        </button>

                        <!-- Sales leads -->
                        <button onclick="switchView('sales-leads')" id="view-sales-leads" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="banknote" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Sales leads</span>
                            </div>
                            <span class="text-xs text-notion-textMuted font-normal">8</span>
                        </button>

                        <!-- Hiring leads -->
                        <button onclick="switchView('hiring-leads')" id="view-hiring-leads" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="user-check" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Hiring leads</span>
                            </div>
                            <span class="text-xs text-notion-textMuted font-normal">2</span>
                        </button>

                        <!-- Meeting requests -->
                        <button onclick="switchView('meeting-requests')" id="view-meeting-requests" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="calendar" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Meeting requests</span>
                            </div>
                        </button>

                        <!-- ... More -->
                        <button onclick="showMoreToast()" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-notion-textMuted hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="more-horizontal" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">More</span>
                            </div>
                        </button>
                    </nav>
                </div>

                <!-- Mail Section -->
                <div class="px-2 pt-3 pb-1">
                    <div class="px-2 py-1 text-[11px] font-semibold text-notion-textMuted uppercase tracking-wider">Mail</div>
                    <nav class="space-y-0.5 mt-0.5">
                        <button onclick="switchView('all-mail')" id="view-all-mail" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="archive" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">All Mail</span>
                            </div>
                        </button>
                        <button onclick="switchView('sent')" id="view-sent" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="send" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Sent</span>
                            </div>
                        </button>
                        <button onclick="switchView('drafts')" id="view-drafts" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md text-sm text-gray-700 dark:text-gray-300 hover:bg-notion-hover dark:hover:bg-notion-hoverDark transition-colors">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <i data-lucide="file-edit" class="w-4 h-4 text-notion-textMuted"></i>
                                <span class="truncate">Drafts</span>
                            </div>
                        </button>
                    </nav>
                </div>
            </div>

            <!-- Sidebar Footer Keys Hint -->
            <div class="p-3 border-t border-notion-border dark:border-notion-borderDark flex items-center justify-between text-notion-textMuted">
                <div class="flex items-center space-x-1.5">
                    <div class="w-5 h-5 rounded border border-gray-300 dark:border-gray-700 flex items-center justify-center text-[10px] font-semibold bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 shadow-xs">N</div>
                    <div class="w-5 h-5 rounded border border-gray-300 dark:border-gray-700 flex items-center justify-center text-[10px] font-semibold bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 shadow-xs">6</div>
                </div>
                <button onclick="showHelpModal()" class="w-6 h-6 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded flex items-center justify-center text-notion-textMuted hover:text-gray-800 dark:hover:text-gray-200 transition-colors">
                    <i data-lucide="help-circle" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-[#121212] overflow-hidden relative">
            
            <!-- Header Toolbar -->
            <header class="h-14 border-b border-notion-border dark:border-notion-borderDark px-6 flex items-center justify-between flex-shrink-0 bg-white/80 dark:bg-[#121212]/80 backdrop-blur">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-1 text-gray-500 hover:text-gray-800">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <!-- Header Icon & Title -->
                    <div class="flex items-center space-x-2.5">
                        <div class="w-6 h-6 rounded flex items-center justify-center text-red-500">
                            <i data-lucide="inbox" class="w-5 h-5"></i>
                        </div>
                        <h1 id="mainViewTitle" class="text-base font-semibold text-gray-900 dark:text-white">Inbox</h1>
                    </div>
                </div>

                <!-- Header Actions -->
                <div class="flex items-center space-x-2">
                    <!-- Auto Label Button (with magic wand/sparkle) -->
                    <button onclick="runAutoLabeling()" class="flex items-center space-x-1.5 px-3 py-1 rounded-md border border-gray-200 dark:border-gray-700 hover:bg-notion-hover dark:hover:bg-notion-hoverDark text-xs font-medium text-gray-700 dark:text-gray-300 shadow-xs transition-colors">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>Auto label</span>
                    </button>

                    <!-- Filter Toggle -->
                    <button onclick="toggleFilterMenu()" class="p-1.5 text-notion-textMuted hover:text-gray-800 dark:hover:text-gray-200 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md transition-colors" title="Filter & Sort">
                        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                    </button>

                    <!-- View Switcher -->
                    <button onclick="toggleCompactView()" class="p-1.5 text-notion-textMuted hover:text-gray-800 dark:hover:text-gray-200 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md transition-colors" title="Toggle Compact View">
                        <i data-lucide="list" class="w-4 h-4"></i>
                    </button>

                    <!-- Settings Gear -->
                    <button onclick="openSettingsModal()" class="p-1.5 text-notion-textMuted hover:text-gray-800 dark:hover:text-gray-200 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md transition-colors" title="Settings">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- Email List Container -->
            <div class="flex-1 overflow-y-auto px-6 py-4 space-y-6" id="emailListContainer">
                
                <!-- UNREAD SECTION -->
                <div id="unreadSection">
                    <!-- Unread Header -->
                    <div class="flex items-center space-x-2 text-xs font-medium text-notion-textMuted mb-2 cursor-pointer select-none group" onclick="toggleSection('unreadContainer', 'unreadChevron')">
                        <i data-lucide="square" class="w-3.5 h-3.5 text-gray-400"></i>
                        <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Unread</span>
                        <i data-lucide="chevron-down" id="unreadChevron" class="w-3.5 h-3.5 text-gray-400 group-hover:text-gray-600 transition-transform"></i>
                    </div>

                    <!-- Unread Emails List -->
                    <div id="unreadContainer" class="space-y-0.5 divide-y divide-gray-100 dark:divide-gray-800/60">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <!-- READ SECTION -->
                <div id="readSection" class="pt-2">
                    <!-- Read Header -->
                    <div class="flex items-center space-x-2 text-xs font-medium text-notion-textMuted mb-2 cursor-pointer select-none group" onclick="toggleSection('readContainer', 'readChevron')">
                        <i data-lucide="check-square-2" class="w-3.5 h-3.5 text-gray-400"></i>
                        <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">Read</span>
                        <i data-lucide="chevron-down" id="readChevron" class="w-3.5 h-3.5 text-gray-400 group-hover:text-gray-600 transition-transform"></i>
                    </div>

                    <!-- Read Emails List -->
                    <div id="readContainer" class="space-y-0.5 divide-y divide-gray-100 dark:divide-gray-800/60">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

            </div>
        </main>

        <!-- THREAD READING PANE / SLIDE-OVER -->
        <div id="threadPane" class="hidden absolute right-0 top-0 h-full w-full md:w-[620px] lg:w-[700px] bg-white dark:bg-[#181818] border-l border-notion-border dark:border-notion-borderDark shadow-2xl z-30 flex flex-col transition-all duration-300">
            <!-- Thread Header -->
            <div class="h-14 border-b border-notion-border dark:border-notion-borderDark px-6 flex items-center justify-between flex-shrink-0 bg-white/90 dark:bg-[#181818]/90 backdrop-blur">
                <div class="flex items-center space-x-2">
                    <button onclick="closeThreadPane()" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted hover:text-gray-800 dark:hover:text-gray-200 transition-colors" title="Close (Esc)">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                    <span class="text-xs text-notion-textMuted font-mono">Press Esc to close</span>
                </div>

                <div class="flex items-center space-x-1">
                    <button onclick="navigateThread('prev')" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted transition-colors" title="Previous Thread (K)">
                        <i data-lucide="chevron-up" class="w-4 h-4"></i>
                    </button>
                    <button onclick="navigateThread('next')" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted transition-colors" title="Next Thread (J)">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <div class="h-4 w-px bg-gray-200 dark:bg-gray-700 mx-1"></div>
                    <button onclick="toggleCurrentReadState()" id="threadReadToggleBtn" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted transition-colors" title="Mark as Unread (Shift+U)">
                        <i data-lucide="mail-open" class="w-4 h-4"></i>
                    </button>
                    <button onclick="archiveCurrentThread()" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted transition-colors" title="Archive">
                        <i data-lucide="archive" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteCurrentThread()" class="p-1.5 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md text-notion-textMuted hover:text-red-600 transition-colors" title="Delete">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Thread Detail Body -->
            <div class="flex-1 overflow-y-auto p-8 space-y-6" id="threadPaneContent">
                <!-- Content dynamically injected here -->
            </div>

            <!-- Thread Quick Reply Box -->
            <div class="p-4 border-t border-notion-border dark:border-notion-borderDark bg-gray-50/50 dark:bg-[#151515]">
                <div class="border border-notion-border dark:border-notion-borderDark rounded-lg bg-white dark:bg-[#202020] p-3 shadow-2xs">
                    <textarea id="replyTextarea" placeholder="Write a reply..." class="w-full bg-transparent text-sm resize-none focus:outline-none text-gray-800 dark:text-gray-200 h-16"></textarea>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100 dark:border-gray-800">
                        <div class="flex items-center space-x-1">
                            <button onclick="generateAIReply()" class="flex items-center space-x-1 px-2.5 py-1 text-xs rounded bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 font-medium hover:bg-purple-100 transition-colors">
                                <i data-lucide="sparkles" class="w-3 h-3 text-purple-500"></i>
                                <span>Draft with AI</span>
                            </button>
                            <button class="p-1 text-gray-400 hover:text-gray-600 rounded"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <button onclick="sendReply()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-medium transition-colors flex items-center space-x-1">
                            <span>Send</span>
                            <i data-lucide="send" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMMAND PALETTE MODAL (IMAGE 2 RECREATION) -->
    <div id="commandPaletteModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-start justify-center pt-20 px-4 transition-opacity">
        <div class="bg-white dark:bg-[#1e1e1e] w-full max-w-xl rounded-xl shadow-2xl border border-notion-border dark:border-notion-borderDark overflow-hidden flex flex-col command-modal-shadow transform transition-all duration-150">
            
            <!-- Command Input Box -->
            <div class="flex items-center px-4 py-3 border-b border-notion-border dark:border-notion-borderDark">
                <i data-lucide="search" class="w-4 h-4 text-notion-textMuted mr-3 flex-shrink-0"></i>
                <input type="text" id="commandInput" placeholder="Search commands or Notion Mail..." class="w-full bg-transparent text-sm text-gray-800 dark:text-gray-100 placeholder-notion-textMuted focus:outline-none" oninput="filterCommands()">
            </div>

            <!-- Command List -->
            <div id="commandList" class="max-h-96 overflow-y-auto p-1 space-y-1">
                
                <!-- Category: Thread -->

            {

                preview: 'Deployment for lumi-web-portal preview environment succeeded in 42s.',
                body: "Your project lumi-web-portal was deployed successfully. Click to inspect preview environment.",

            {

                email: 'comments@figma.com',
                subject: 'Alex commented on "Notion Mail Redesign 2025"',
                preview: 'Alex: "Looks super crisp! Can we make sure the command palette shortcuts are clear?"',
                body: "Alex commented on Notion Mail Redesign 2025:\n\n'Looks super crisp! Can we make sure the command palette shortcuts are clear?'",
                tag: 'Project',
                tagType: 'blue',
                time: 'Oct 12',
                isUnread: false,
                view: 'inbox'
            }
        ];

        // STATE VARIABLES
        let emails = [...initialEmails];
        let activeView = 'inbox';
        let activeThreadId = null;

        // INITIALIZATION
        window.onload = function() {
            renderEmailList();
            lucide.createIcons();
            setupKeyboardShortcuts();
        };

        // RENDER EMAIL LIST
        function renderEmailList() {
            const unreadContainer = document.getElementById('unreadContainer');
            const readContainer = document.getElementById('readContainer');
            
            // Filter by active view
            let filtered = emails.filter(e => {
                if (activeView === 'inbox') return e.view === 'inbox';
                if (activeView === 'project-updates') return e.tag === 'Project';
                if (activeView === 'sales-leads') return e.tag === 'Leads' || e.sender.includes('Tangerine');
                if (activeView === 'hiring-leads') return e.tag === 'Recruiting';
                if (activeView === 'leadership-updates') return e.tag === 'Urgent';
                return true;
            });

            const unreadEmails = filtered.filter(e => e.isUnread);
            const readEmails = filtered.filter(e => !e.isUnread);

            // Update badge count
            document.getElementById('badge-inbox').innerText = emails.filter(e => e.isUnread).length;

            // Render Unread Emails
            if (unreadEmails.length === 0) {
                unreadContainer.innerHTML = `<div class="py-4 text-xs text-notion-textMuted italic">No unread messages</div>`;
            } else {
                unreadContainer.innerHTML = unreadEmails.map(email => createEmailRowHTML(email)).join('');
            }

            // Render Read Emails
            if (readEmails.length === 0) {
                readContainer.innerHTML = `<div class="py-4 text-xs text-notion-textMuted italic">No read messages</div>`;
            } else {
                readContainer.innerHTML = readEmails.map(email => createEmailRowHTML(email)).join('');
            }

            lucide.createIcons();
        }

        // GENERATE HTML FOR AN EMAIL ROW
        function createEmailRowHTML(email) {
            const tagBadge = email.tag ? getTagBadgeHTML(email.tag, email.tagType) : '';
            const unreadDot = email.isUnread ? '<span class="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0"></span>' : '<span class="w-2 h-2"></span>';

            return `
                <div onclick="openThreadPane('${email.id}')" class="group flex items-center justify-between py-2.5 px-2 hover:bg-notion-hover dark:hover:bg-notion-hoverDark rounded-md cursor-pointer transition-colors">
                    <div class="flex items-center space-x-3 min-w-0 pr-4">
                        ${unreadDot}
                        <span class="font-semibold text-sm text-gray-900 dark:text-gray-100 w-36 truncate flex-shrink-0">${email.sender}</span>
                        <span class="text-sm text-gray-700 dark:text-gray-300 truncate font-normal">${email.subject}</span>
                    </div>
                    <div class="flex items-center space-x-3 flex-shrink-0">
                        ${tagBadge}
                        <span class="text-xs text-notion-textMuted w-16 text-right">${email.time}</span>
                    </div>
                </div>
            `;
        }

        // TAG BADGE HELPER
        function getTagBadgeHTML(tag, type) {
            let bgClass = 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
            if (type === 'blue') bgClass = 'bg-[#e0f2fe] text-[#0369a1] dark:bg-sky-950/60 dark:text-sky-300';
            if (type === 'red') bgClass = 'bg-[#ffe4e6] text-[#be123c] dark:bg-rose-950/60 dark:text-rose-300';
            if (type === 'pink') bgClass = 'bg-[#fce7f3] text-[#be185d] dark:bg-pink-950/60 dark:text-pink-300';
            if (type === 'purple') bgClass = 'bg-[#f3e8ff] text-[#7e22ce] dark:bg-purple-950/60 dark:text-purple-300';
            if (type === 'green') bgClass = 'bg-[#dcfce7] text-[#15803d] dark:bg-emerald-950/60 dark:text-emerald-300';

            return `<span class="px-2 py-0.5 text-xs font-medium rounded-md ${bgClass}">${tag}</span>`;
        }


        // THREAD PANE LOGIC
        function openThreadPane(id) {
            activeThreadId = id;
            const email = emails.find(e => e.id === id);
            if (!email) return;

            // Mark as read
            email.isUnread = false;
            renderEmailList();

            const pane = document.getElementById('threadPane');
            const content = document.getElementById('threadPaneContent');

            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-start justify-between">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white">${email.subject}</h2>
                        ${email.tag ? getTagBadgeHTML(email.tag, email.tagType) : ''}
                    </div>

                    <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 pb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 font-semibold flex items-center justify-center text-sm">
                                ${email.sender.substring(0, 2)}
                            </div>
                            <div>
                                <div class="font-semibold text-sm text-gray-900 dark:text-gray-100">${email.sender}</div>
                                <div class="text-xs text-notion-textMuted">${email.email}</div>
                            </div>
                        </div>
                        <span class="text-xs text-notion-textMuted">${email.time}</span>
                    </div>

                    <div class="pt-2 text-sm leading-relaxed text-gray-800 dark:text-gray-200 whitespace-pre-line">
                        ${email.body}
                    </div>
                </div>
            `;

            pane.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeThreadPane() {
            document.getElementById('threadPane').classList.add('hidden');
            activeThreadId = null;
        }

        function navigateThread(direction) {
            if (!activeThreadId) return;
            const currentIndex = emails.findIndex(e => e.id === activeThreadId);
            if (currentIndex === -1) return;

            let nextIndex = direction === 'next' ? currentIndex + 1 : currentIndex - 1;
            if (nextIndex >= 0 && nextIndex < emails.length) {
                openThreadPane(emails[nextIndex].id);
            }
        }

        function toggleCurrentReadState() {
            if (!activeThreadId) return;
            const email = emails.find(e => e.id === activeThreadId);
            if (email) {
                email.isUnread = !email.isUnread;
                renderEmailList();
                showToast(email.isUnread ? 'Marked as unread' : 'Marked as read');
            }
        }

        function archiveCurrentThread() {
            if (!activeThreadId) return;
            emails = emails.filter(e => e.id !== activeThreadId);
            closeThreadPane();
            renderEmailList();
            showToast('Thread archived');
        }

        function deleteCurrentThread() {
            if (!activeThreadId) return;
            emails = emails.filter(e => e.id !== activeThreadId);
            closeThreadPane();
            renderEmailList();
            showToast('Thread deleted');
        }

        // VIEW SWITCHING
        function switchView(viewName) {
            activeView = viewName;
            
            // Highlight sidebar item
            const navButtons = document.querySelectorAll('#viewsNav button, #sidebar button[id^="view-"]');
            navButtons.forEach(btn => {
                btn.classList.remove('bg-notion-active', 'dark:bg-notion-activeDark', 'font-medium', 'text-gray-900', 'dark:text-white');
                btn.classList.add('text-gray-700', 'dark:text-gray-300');
            });

            const activeBtn = document.getElementById(`view-${viewName}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-notion-active', 'dark:bg-notion-activeDark', 'font-medium', 'text-gray-900', 'dark:text-white');
            }

            // Update title
            const titleMap = {
                'inbox': 'Inbox',
                'project-updates': 'Project updates',
                'leadership-updates': 'Leadership updates',
                'sales-leads': 'Sales leads',
                'hiring-leads': 'Hiring leads',
                'meeting-requests': 'Meeting requests',
                'all-mail': 'All Mail',
                'sent': 'Sent',
                'drafts': 'Drafts'
            };
            document.getElementById('mainViewTitle').innerText = titleMap[viewName] || 'Inbox';

            renderEmailList();
        }


        // COMMAND PALETTE MODAL LOGIC (Matching Screenshot 2)
        function openCommandPalette() {
            document.getElementById('commandPaletteModal').classList.remove('hidden');
            document.getElementById('commandInput').focus();
            document.getElementById('commandInput').value = '';
            filterCommands();
        }

        function closeCommandPalette() {
            document.getElementById('commandPaletteModal').classList.add('hidden');
        }

        function filterCommands() {
            const query = document.getElementById('commandInput').value.toLowerCase();
            const items = document.querySelectorAll('.cmd-item');

            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function executeCommand(commandKey) {
            closeCommandPalette();

            switch (commandKey) {
                case 'close-thread':
                    closeThreadPane();
                    break;
                case 'prev-thread':
                    navigateThread('prev');
                    break;
                case 'next-thread':
                    navigateThread('next');
                    break;
                case 'mark-unread':
                case 'toggle-read':
                    toggleCurrentReadState();
                    break;
                case 'forward':
                case 'reply':
                case 'reply-all':
                case 'reply-all-to':
                case 'reply-all-cc':
                case 'reply-all-bcc':
                    showToast(`Executed: ${commandKey}`);
                    break;
            }
        }

        // COMPOSE MODAL LOGIC
        function openComposeModal() {
            document.getElementById('composeModal').classList.remove('hidden');
            document.getElementById('composeTo').focus();
        }

        function closeComposeModal() {
            document.getElementById('composeModal').classList.add('hidden');
            document.getElementById('composeTo').value = '';
            document.getElementById('composeSubject').value = '';
            document.getElementById('composeBody').value = '';
        }

        function sendNewEmail() {
            const to = document.getElementById('composeTo').value;
            const subject = document.getElementById('composeSubject').value;
            const body = document.getElementById('composeBody').value;

            if (!to || !subject) {
                showToast('Please specify recipient and subject');
                return;
            }

            emails.unshift({
                id: Date.now().toString(),
                sender: 'Stephanie Lee',
                email: 'stephanie.lee@lumi.inc',
                subject: subject,
                preview: body.substring(0, 50) + '...',
                body: body,
                tag: 'Sent',
                tagType: 'green',
                time: 'Just now',
                isUnread: false,
                view: 'sent'
            });

            closeComposeModal();
            renderEmailList();
            showToast('Email sent successfully!');
        }

        function aiDraftCompose() {
            document.getElementById('composeSubject').value = 'Follow up: Lumi Inc. Q4 Project Milestones';
            document.getElementById('composeBody').value = 'Hi team,\n\nI hope you are having a productive week. I am following up on our Q4 deliverables for Project Lumi. Please review the updated Notion dashboard and let me know if you have any questions.\n\nBest,\nStephanie';
            showToast('Notion AI generated email draft!');
        }


        // AI AUTO-LABELING SIMULATION
        function runAutoLabeling() {
            showToast('Notion AI scanning & auto-labeling messages...');
            
            setTimeout(() => {
                let labeledCount = 0;
                emails.forEach(e => {
                    if (!e.tag) {
                        if (e.subject.toLowerCase().includes('financial') || e.subject.toLowerCase().includes('venture')) {
                            e.tag = 'Sales';
                            e.tagType = 'purple';
                        } else {
                            e.tag = 'Project';
                            e.tagType = 'blue';
                        }
                        labeledCount++;
                    }
                });

                renderEmailList();
                showToast(`Auto labeled ${labeledCount} messages with Notion AI!`);
            }, 800);
        }

        // KEYBOARD SHORTCUTS
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Cmd+K or Ctrl+K -> Command Palette
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    openCommandPalette();
                }

                // Escape -> Close Modals or Thread Pane
                if (e.key === 'Escape') {
                    closeCommandPalette();
                    closeComposeModal();
                    closeThreadPane();
                }

                // Keyboard shortcuts when no inputs are focused
                const activeTag = document.activeElement.tagName;
                if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
                    if (e.key === 'j' || e.key === 'J') navigateThread('next');
                    if (e.key === 'k' || e.key === 'K') navigateThread('prev');
                    if (e.key === 'u' || e.key === 'U') toggleCurrentReadState();
                    if (e.key === 'n' || e.key === 'N' || e.key === 'c' || e.key === 'C') openComposeModal();
                }
            });
        }

        // UTILITY UI TOGGLES
        function toggleSection(sectionId, chevronId) {
            const container = document.getElementById(sectionId);
            const chevron = document.getElementById(chevronId);

            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                chevron.classList.remove('rotate-180');
            } else {
                container.classList.add('hidden');
                chevron.classList.add('rotate-180');
            }
        }

        function toggleProfileMenu() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            showToast('Theme updated');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function generateAIReply() {
            document.getElementById('replyTextarea').value = "Thanks for sending this over! I've reviewed the updates and everything looks great on my end. Let's proceed as planned.";
            showToast('AI reply generated!');
        }

        function sendReply() {
            const val = document.getElementById('replyTextarea').value;
            if (val) {
                document.getElementById('replyTextarea').value = '';
                showToast('Reply sent!');
            }
        }

        function showMoreToast() {
            showToast('Additional Notion views loaded');
        }

        function openSettingsModal() {
            showToast('Notion Mail Settings opened');
        }

        function showHelpModal() {
            showToast('Help & Shortcuts: ⌘K (Command Palette), N (Compose), J/K (Navigate)');
        }

        // TOAST NOTIFICATION SYSTEM
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.innerText = message;

            toast.classList.remove('hidden');
            toast.classList.remove('translate-y-2');

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.add('translate-y-2');
            }, 2500);
        }
    </script>
</body>
</html>
